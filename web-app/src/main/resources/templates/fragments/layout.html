<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">College Ride Share</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">
            <i class="bi bi-car-front-fill me-2"></i>College Ride Share
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}"><i class="bi bi-house-door me-1"></i>Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/rides/available}"><i class="bi bi-search me-1"></i>Book a Ride</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/rides/offer}"><i class="bi bi-plus-circle me-1"></i>Offer a Ride</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/rides/my}"><i class="bi bi-car-front me-1"></i>My Rides</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/bookings/my}"><i class="bi bi-ticket me-1"></i>My Bookings</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/notifications}">
                        <i class="bi bi-bell me-1"></i>Notifications
                        <span th:if="${unreadCount != null && unreadCount > 0}"
                              class="badge bg-danger" th:text="${unreadCount}"></span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/emergency}"><i class="bi bi-telephone me-1"></i>Emergency</a>
                </li>
            </ul>
            <div class="d-flex align-items-center">
                <span class="text-light me-3" sec:authentication="name"
                      th:text="'Welcome, ' + ${#authentication.name}"></span>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-box-arrow-right me-1"></i>Logout
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>

<footer th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</footer>
</html>
