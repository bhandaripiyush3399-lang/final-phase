<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login - College Ride Share')}"></head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-5">
                <div class="card shadow-lg border-0">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <i class="bi bi-car-front-fill text-primary" style="font-size: 3rem;"></i>
                            <h2 class="mt-2 fw-bold text-primary">College Ride Share</h2>
                            <p class="text-muted">Connect with fellow students for rides</p>
                        </div>

                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Roll Number</label>
                                <input type="text" name="rollNumber" class="form-control form-control-lg"
                                       placeholder="e.g., PICT001" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Password</label>
                                <input type="password" name="password" class="form-control form-control-lg"
                                       placeholder="Enter your password" required>
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg w-100">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Login
                            </button>
                        </form>

                        <hr>
                        <div class="text-center">
                            <a th:href="@{/register}" class="text-decoration-none">
                                New student? <strong>Register here</strong>
                            </a>
                        </div>
                        <p class="text-muted text-center mt-3 small">
                            <i class="bi bi-shield-lock me-1"></i>
                            Only registered college students can access this system
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
