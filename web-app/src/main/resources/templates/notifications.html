<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Notifications - College Ride Share')}"></head>
<body class="bg-light">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-0">Notifications</h2>
                <p class="text-muted mb-0">Stay updated on your ride bookings and requests</p>
            </div>
            <form th:action="@{/notifications/read}" method="post">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-all me-1"></i>Mark All as Read
                </button>
            </form>
        </div>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

        <div th:if="${#lists.isEmpty(notifications)}" class="text-center py-5">
            <i class="bi bi-bell-slash text-muted" style="font-size: 4rem;"></i>
            <h5 class="mt-3 text-muted">No notifications yet</h5>
        </div>

        <div th:each="notif : ${notifications}" class="card border-0 shadow-sm mb-2"
             th:classappend="${!notif.read ? 'border-start border-primary border-3' : ''}">
            <div class="card-body p-3">
                <div class="d-flex align-items-start">
                    <div class="me-3">
                        <span class="badge" th:classappend="${notif.typeBadgeClass}"
                              th:text="${notif.typeDisplayName}"></span>
                    </div>
                    <div class="flex-grow-1">
                        <p class="mb-1" th:classappend="${!notif.read ? 'fw-bold' : ''}"
                           th:text="${notif.message}"></p>
                        <small class="text-muted" th:text="${notif.formattedTime}"></small>
                    </div>
                    <div th:if="${!notif.read}">
                        <span class="badge bg-primary">New</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
