<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Offered Rides - College Ride Share')}"></head>
<body class="bg-light">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container py-4">
        <h2 class="fw-bold mb-1">My Offered Rides</h2>
        <p class="text-muted mb-4">Manage rides you have offered and handle booking requests</p>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div th:if="${#lists.isEmpty(rides)}" class="text-center py-5">
            <i class="bi bi-car-front text-muted" style="font-size: 4rem;"></i>
            <h5 class="mt-3 text-muted">You haven't offered any rides yet</h5>
            <a th:href="@{/rides/offer}" class="btn btn-primary mt-2">Offer a Ride</a>
        </div>

        <div th:each="ride : ${rides}" class="card border-0 shadow-sm mb-3">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-start mb-3">
                    <div>
                        <h5 class="fw-bold mb-1">
                            <span th:text="${ride.routeFrom}"></span>
                            <i class="bi bi-arrow-right mx-2 text-primary"></i>
                            <span th:text="${ride.routeTo}"></span>
                        </h5>
                        <span class="badge me-2"
                              th:classappend="${ride.status.name() == 'ACTIVE' ? 'bg-success' :
                                               ride.status.name() == 'FULL' ? 'bg-warning text-dark' :
                                               ride.status.name() == 'CANCELLED' ? 'bg-danger' : 'bg-secondary'}"
                              th:text="${ride.status}"></span>
                        <span class="badge"
                              th:classappend="${ride.vehicleType.name() == 'BIKE' ? 'bg-warning text-dark' : 'bg-info'}"
                              th:text="${ride.vehicleDisplayName}"></span>
                    </div>
                    <div th:if="${ride.status.name() == 'ACTIVE' || ride.status.name() == 'FULL'}">
                        <form th:action="@{/rides/cancel/{id}(id=${ride.rideId})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-outline-danger btn-sm"
                                    onclick="return confirm('Cancel this ride? All bookings will be cancelled.')">
                                <i class="bi bi-x-circle me-1"></i>Cancel Ride
                            </button>
                        </form>
                    </div>
                </div>

                <p class="mb-1 text-muted">
                    <i class="bi bi-clock me-1"></i><span th:text="${ride.formattedDeparture}"></span> |
                    <i class="bi bi-people me-1"></i>Seats: <span th:text="${ride.availableSeats + '/' + ride.totalSeats}"></span> |
                    <i class="bi bi-cash me-1"></i>Rs. <span th:text="${#numbers.formatDecimal(ride.fare, 1, 2)}"></span>
                </p>

                <!-- Booking Requests -->
                <div th:if="${bookingsMap.containsKey(ride.rideId) && !bookingsMap.get(ride.rideId).isEmpty()}" class="mt-3">
                    <h6 class="fw-bold">Booking Requests:</h6>
                    <div class="table-responsive">
                        <table class="table table-sm">
                            <thead>
                                <tr>
                                    <th>Student</th>
                                    <th>College</th>
                                    <th>Phone</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="booking : ${bookingsMap.get(ride.rideId)}">
                                    <td th:text="${booking.seeker.fullName}"></td>
                                    <td th:text="${booking.seeker.college.collegeCode}"></td>
                                    <td th:text="${booking.seeker.phone}"></td>
                                    <td>
                                        <span class="badge"
                                              th:classappend="${booking.status.name() == 'PENDING' ? 'bg-warning text-dark' :
                                                               booking.status.name() == 'ACCEPTED' ? 'bg-success' :
                                                               booking.status.name() == 'REJECTED' ? 'bg-danger' : 'bg-secondary'}"
                                              th:text="${booking.status}"></span>
                                    </td>
                                    <td>
                                        <div th:if="${booking.status.name() == 'PENDING' && ride.status.name() != 'CANCELLED' && ride.availableSeats > 0}">
                                            <form th:action="@{/bookings/accept/{id}(id=${booking.bookingId})}"
                                                  method="post" class="d-inline">
                                                <button type="submit" class="btn btn-success btn-sm">Accept</button>
                                            </form>
                                            <form th:action="@{/bookings/reject/{id}(id=${booking.bookingId})}"
                                                  method="post" class="d-inline ms-1">
                                                <button type="submit" class="btn btn-danger btn-sm">Reject</button>
                                            </form>
                                        </div>
                                        <span th:if="${booking.status.name() == 'PENDING' && ride.availableSeats <= 0}"
                                              class="text-muted small">Ride full</span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
