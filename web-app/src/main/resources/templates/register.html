<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register - College Ride Share')}"></head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center py-5">
            <div class="col-md-6">
                <div class="card shadow-lg border-0">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h2 class="fw-bold text-primary">Student Registration</h2>
                            <p class="text-muted">Only registered college students can access this system</p>
                        </div>

                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                        <form th:action="@{/register}" method="post">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Roll Number</label>
                                <input type="text" name="rollNumber" class="form-control" placeholder="e.g., PICT001" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Full Name</label>
                                <input type="text" name="fullName" class="form-control" placeholder="Your full name" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Email</label>
                                <input type="email" name="email" class="form-control" placeholder="your@email.com" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Phone (optional)</label>
                                <input type="text" name="phone" class="form-control" placeholder="9876543210">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">College</label>
                                <select name="collegeId" class="form-select" required>
                                    <option value="">Select Your College</option>
                                    <option th:each="college : ${colleges}"
                                            th:value="${college.collegeId}"
                                            th:text="${college.collegeName + ' (' + college.collegeCode + ')'}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Password (min 6 chars)</label>
                                <input type="password" name="password" class="form-control" minlength="6" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Confirm Password</label>
                                <input type="password" name="confirmPassword" class="form-control" minlength="6" required>
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg w-100">
                                <i class="bi bi-person-plus me-2"></i>Register
                            </button>
                        </form>
                        <hr>
                        <div class="text-center">
                            <a th:href="@{/}" class="text-decoration-none">
                                Already registered? <strong>Login here</strong>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
